/* Original illustrated reward art; input cards remain active while the reveal animates. */
.reward-cutscene{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;height:88px;border-radius:15px;margin:5px 0 10px;border:1px solid #d9c36d88;background:radial-gradient(ellipse at 50% 90%,#7357b880,transparent 70%),linear-gradient(110deg,#172048,#302052,#141b3a);pointer-events:none}
.reward-cutscene::before{content:"";position:absolute;width:210px;height:120px;border-radius:50%;background:radial-gradient(ellipse,#ffe18755,transparent 72%);animation:reward-glimmer 1.2s ease-in-out infinite alternate}
.reward-chest{position:relative;width:82px;height:61px;filter:drop-shadow(0 4px 10px #fbc35b99);animation:reward-lift .7s ease-out both}
.reward-chest-body{position:absolute;bottom:0;width:82px;height:45px;border:4px solid #ffdd79;border-radius:6px 6px 12px 12px;background:linear-gradient(#8c64c7,#453d91);box-shadow:inset 0 -12px #181c55}
.reward-chest-body::after{content:"";position:absolute;top:8px;left:32px;width:10px;height:21px;border:2px solid #fff2af;border-radius:4px;background:#ffb845}
.reward-chest-lid{position:absolute;top:0;left:-3px;width:88px;height:23px;border:4px solid #ffe79a;border-radius:9px 9px 4px 4px;background:linear-gradient(#ffc96e,#9c5ed5);transform-origin:bottom center;z-index:2;animation:reward-open .65s .13s cubic-bezier(.2,.9,.28,1.3) both}
.reward-chest-spark{position:absolute;left:50%;top:15%;width:6px;height:6px;background:#fff3ac;box-shadow:-29px 22px 0 #7ce6fb,24px 17px 0 #fff1a5,-45px -4px 0 #ffd366,45px -18px 0 #92f1ff;transform:rotate(45deg);animation:reward-glimmer .8s .15s ease-in-out infinite alternate}
.reward-sigil{width:77px;height:77px;border:5px solid #ed96ff;border-radius:50%;box-shadow:0 0 16px #cc69ff, inset 0 0 12px #6f7aff;position:relative;animation:reward-lift .75s ease both}
.reward-sigil::before{content:"";position:absolute;inset:10px;border:4px dashed #ffe595;border-radius:50%;animation:reward-spin 6s linear infinite}
.reward-sigil::after{content:"";position:absolute;inset:26px;border-radius:50%;background:#ffe6a3;box-shadow:0 0 20px #d3aaff}
@keyframes reward-lift{from{opacity:0;transform:translateY(22px) scale(.7)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes reward-open{0%,20%{transform:translateY(0) rotate(0)}100%{transform:translateY(-18px) rotate(-20deg)}}
@keyframes reward-spin{to{transform:rotate(360deg)}}
@keyframes reward-glimmer{from{opacity:.55;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}
@media(prefers-reduced-motion:reduce){.reward-cutscene *,.reward-cutscene::before{animation:none!important}.reward-chest-lid{transform:translateY(-15px) rotate(-20deg)}}
 .reward-cutscene.no-motion *,.reward-cutscene.no-motion::before{animation:none!important}.reward-cutscene.no-motion .reward-chest-lid{transform:translateY(-15px) rotate(-20deg)}

 save.advancedTalents=Array.from({length:ADV_TALENTS.length},(_,i)=>Math.max(0,Math.min(3,Math.floor(Number(save.advancedTalents?.[i])||0))));
}
function gearDef(item){return GEAR_DEFS.find(d=>d.id===item?.def)}
function gearValue(item){const def=gearDef(item);if(!def)return 0;return +(def.base*GEAR_RARITIES[item.rarity].factor*(1+(item.level-1)*.16)).toFixed(2)}
function gearText(item){const def=gearDef(item);if(!def)return '';return def.stat==='rate'?'攻速 +'+gearValue(item)+'%':({hp:'生命',atk:'攻击',def:'防御',crit:'暴击',speed:'移动',magnet:'拾取',regen:'恢复'}[def.stat]||def.stat)+' +'+gearValue(item)+def.unit}
function gearSets(){const count={nova:0,fort:0};for(const id of Object.values(save.gearEquipped)){const it=save.gearInventory.find(x=>x.uid===id),def=gearDef(it);if(def)count[def.set]++}return count}
function gearBonuses(){
 const result={hp:0,atk:0,def:0,crit:0,speed:0,magnet:0,regen:0,rate:0};
 for(const slot of GEAR_SLOTS.slice(1)){
  const item=save.gearInventory.find(it=>it.uid===save.gearEquipped[slot.id]),def=gearDef(item);
  if(def)result[def.stat]+=gearValue(item);
 }
 const sets=gearSets();
 if(sets.nova>=2)result.atk+=5;
 if(sets.fort>=2)result.hp+=24;
 return result;
}

function upgradeGear(uid){

 if(!it||it.level>=10)return false;

 else if(save.activePet==='med'){p.maxHp+=8*lv;p.hp+=8*lv;p.regen+=.12*lv}

}
function updatePetBattle(g,dt){
 const lv=petLevel(save.activePet);if(!lv)return;
 g.petCd=(g.petCd||0)-dt;
 if(g.petCd>0)return;
 const p=g.player;
 if(save.activePet==='arc'){
  g.petCd=2.7;
  const e=nearestEnemy(p.x,p.y,850);
  if(e){damageEnemy(e,p.damage*(.36+lv*.13));
   if(g.effects.length<110)g.effects.push({x:e.x,y:e.y,r:30+lv*3,life:.3,max:.3,color:'#83cfff',kind:'lightning'})}
 }else if(save.activePet==='med'){
  g.petCd=8;
  if(p.hp<p.maxHp){const heal=6+lv*3;p.hp=Math.min(p.maxHp,p.hp+heal);
   if(g.effects.length<110)g.effects.push({x:p.x,y:p.y,r:80,life:.48,max:.48,color:'#8cffb1'})}
 }else if(save.activePet==='mag'){
  g.petCd=5;
  for(const d of g.drops)if(d.xp&&Math.hypot(d.x-p.x,d.y-p.y)<260+lv*40){d.x+=(p.x-d.x)*.68;d.y+=(p.y-d.y)*.68}
 }
}

function purchaseDailyProduct(i){

 if(!product||save.shopDaily.claims.includes(i))return false;
 if(i>=2&&i!==3&&save.gearInventory.length>=80){toast('装备背包已满');return false}
 if(product.currency==='coins'){

 }else if(product.currency==='gems'){
  if(save.gems<product.cost){toast('钻石不足');return false}

 }

 return true;
}

window.focusForgeItem=function(uid){if(game||!item(uid))return;selectedUid=uid;showPanel("forge")};
window.forgeUpgrade=function(){
 if(game)return false;const i=item(selectedUid);if(!i||i.rarity<2)return false;
 const next=forgeLv(i.uid)+1,max=i.rarity>=3?5:3,c=fCost(next);
 if(next>max||save.gearParts<c.parts||save.petCores<c.cores)return false;
 save.gearParts-=c.parts;save.petCores-=c.cores;save.gearForge[i.uid]=next;
 reRender();return true;
};
window.forgeReset=function(){
 if(game)return false;const i=item(selectedUid);if(!i||!forgeLv(i.uid)||xenoLv(i.uid)||save.gearFusion[i.uid])return false;
 for(let t=1;t<=forgeLv(i.uid);t++){const c=fCost(t);save.gearParts+=c.parts;save.petCores+=c.cores}
 delete save.gearForge[i.uid];reRender();return true;
};
window.xenoUpgrade=function(){
 if(game)return false;const i=item(selectedUid);
 if(!i||i.rarity<3||forgeLv(i.uid)<3||xenoLv(i.uid)>=3)return false;
 const next=xenoLv(i.uid)+1,c=xCost(next);
 if(save.vehicleParts<c.vehicle||save.petCores<c.cores)return false;
 save.vehicleParts-=c.vehicle;save.petCores-=c.cores;save.gearXeno[i.uid]=next;
 reRender();return true;
};
window.xenoReset=function(){
 if(game)return false;const i=item(selectedUid);if(!i||!xenoLv(i.uid))return false;
 for(let t=1;t<=xenoLv(i.uid);t++){const c=xCost(t);save.vehicleParts+=c.vehicle;save.petCores+=c.cores}
 delete save.gearXeno[i.uid];reRender();return true;
};
window.fusionApply=function(uid){
 if(game)return false;const target=item(selectedUid),donor=item(uid);
 if(!target||!donor||target.uid===donor.uid||target.rarity<3||donor.rarity<3||
    gearDef(target)?.slot!==gearDef(donor)?.slot||donor.locked||save.gearFusion[target.uid]||
    forgeLv(donor.uid)||xenoLv(donor.uid)||save.gearFusion[donor.uid]||
    Object.values(save.gearEquipped).includes(donor.uid))return false;
 save.gearInventory=save.gearInventory.filter(x=>x.uid!==uid);save.gearFusion[target.uid]={...donor};
 reRender();return true;
};
window.fusionUndo=function(){
 if(game)return false;const target=item(selectedUid);
 if(!target||!save.gearFusion[target.uid]||save.gearInventory.length>=80)return false;
 const donor=save.gearFusion[target.uid];
 if(item(donor.uid))return false;
 save.gearInventory.push({...donor});delete save.gearFusion[target.uid];
 reRender();return true;
};
const prevGearInventory=renderGearInventory;
renderGearInventory=function(){
 return '<div class="forge-note"><b>星核工坊</b> · 史诗和传奇装备可进行神铸、异星神炼与混沌融合。'+
 '<button class="expansion-control" style="margin-left:6px" onclick="showPanel(\'forge\')">打开装备神铸</button></div>'+
 prevGearInventory();
};
const prevPanel=showPanel;
showPanel=function(which){
 if(which!=="forge")return prevPanel(which);
 if(game)return;
 ensureForge();
 document.getElementById("subpageTitle").textContent="装备神铸";
 document.getElementById("subpageCoins").textContent=displayCoins();
 document.getElementById("subpageBody").innerHTML='<div class="arcade-panel-shell">'+panel()+'</div>';
 document.getElementById("home").classList.remove("active");document.getElementById("subpage").classList.add("active");
 document.getElementById("subpageBody").scrollTop=0;
 document.querySelectorAll(".subpage-bottom button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="armory"));
};
window.__forgeQA={read:()=>({forge:JSON.parse(JSON.stringify(ensureForge().gearForge)),
 xeno:JSON.parse(JSON.stringify(save.gearXeno)),
 fusion:JSON.parse(JSON.stringify(save.gearFusion))}),
 multiplier:powerMul,focus:uid=>{selectedUid=uid}};
ensureForge();
})();
