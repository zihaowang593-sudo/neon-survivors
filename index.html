pr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const r=heroCv.getBoundingClientRect();heroCv.width=Math.max(1,r.width*dpr);heroCv.height=Math.max(1,r.height*dpr);hc.setTransform(dpr,0,0,dpr,0,0);backgroundStars=Array.from({length:85},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(.5,2)}))}addEventListener('resize',resize);function updateHome(){ $('coins').textContent=save.coins.toLocaleString();$('gems').textContent=save.gems;$('metaLv').textContent=save.level;$('best').textContent=formatTime(save.best);$('totalKills').textContent=save.totalKills;$('runs').textContent=save.runs;$('equipName').textContent=weapons[save.weapon].name;$('dailyProgress').textContent=`${Math.min(save.daily,100)}/100`;$('dailyClaim').disabled=save.daily<100||save.claimed;$('dailyClaim').textContent=save.claimed?'已领取':'领取 +150';persist()}function formatTime(t){let s=Math.floor(t);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function claimDaily(){if(save.daily>=100&&!save.claimed){save.coins+=150;save.claimed=true;updateHome()}}function showHome(){game=null;paused=false;modalOpen=false;$('home').classList.add('active');$('hud').classList.remove('active');$('overlay').classList.remove('show');updateHome()}function showModal(html){modalOpen=true;$('modal').innerHTML=html;$('overlay').classList.add('show')}function closeModal(){modalOpen=false;$('overlay').classList.remove('show')}function showPanel(which){let html='';if(which==='armory'){html='<h2>🔫 武器库</h2><div class="shopgrid">'+weapons.map((w,i)=>`<div class="panel shopitem"><div class="big">${w.icon}</div><b>${w.name}</b><p class="desc">伤害 ${w.damage} · 射速 ${(1/w.rate).toFixed(1)}/秒</p><button class="btn ${save.weapon===i?'green':'alt'}" onclick="buyWeapon(${i})">${save.weapon===i?'已装备':save.unlocked.includes(i)?'装备':`🪙 ${w.price}`}</button></div>`).join('')+'</div>'}if(which==='talents'){const names=['❤️ 生命强化','🔫 火力强化','👟 移动
