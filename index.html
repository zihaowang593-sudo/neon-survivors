ed:530,color:'#ffb442',price:1200},{name:'冰霜射线',icon:'❄️',damage:25,rate:.41,speed:700,color:'#88faff',price:2000}];const upgrades=[{id:'dmg',icon:'🔥',name:'火力强化',desc:'攻击伤害 +25%',max:8},{id:'rate',icon:'⚡',name:'极速装填',desc:'攻击速度 +18%',max:7},{id:'multi',icon:'🎯',name:'多重弹幕',desc:'每次额外发射一枚弹丸',max:4},{id:'pierce',icon:'💫',name:'贯穿弹头',desc:'子弹穿透目标 +1',max:4},{id:'hp',icon:'💚',name:'生命扩容',desc:'最大生命 +30 并回复生命',max:6},{id:'speed',icon:'👟',name:'疾风步伐',desc:'移动速度 +12%',max:6},{id:'magnet',icon:'🧲',name:'磁力收集',desc:'经验吸取范围 +30%',max:5},{id:'orbit',icon:'🪐',name:'旋刃护卫',desc:'增加一枚环绕能量刃',max:5},{id:'lightning',icon:'🌩️',name:'连锁闪电',desc:'定期电击周围敌人',max:5},{id:'regen',icon:'💉',name:'战地医疗',desc:'每秒恢复生命 +1.5',max:5},{id:'crit',icon:'💥',name:'致命精准',desc:'暴击率 +8%',max:7},{id:'bomb',icon:'🚀',name:'导弹支援',desc:'定期发射范围爆炸导弹',max:5},{id:'shield',icon:'🛡️',name:'应急护盾',desc:'每级增加一层可恢复护盾',max:3},{id:'lifesteal',icon:'🩸',name:'战斗汲取',desc:'击杀敌人有概率回复生命',max:4},{id:'pulse',icon:'🌊',name:'脉冲力场',desc:'周期性震退近身敌人',max:5},{id:'luck',icon:'🍀',name:'战场幸运',desc:'提高治疗物资掉落率',max:4},{id:'armor',icon:'🦾',name:'复合装甲',desc:'受到伤害降低 8%',max:5},{id:'execute',icon:'☠️',name:'处决协议',desc:'子弹对低血量敌人增伤',max:5},{id:'vamp',icon:'💉',name:'急救装置',desc:'每 20 秒自动治疗',max:5},{id:'blast',icon:'💥',name:'冲击弹头',desc:'子弹命中时概率范围爆炸',max:5},{id:'bounce',icon:'🔁',name:'反弹弹幕',desc:'击中目标后概率追踪下一目标',max:4},{id:'frost',icon:'🧊',name:'霜冻弹头',desc:'子弹命中概率减速',max:5},{id:'poison',icon:'☣️',name:'毒蚀弹头',desc:'子弹命中附加持续伤害',max:5},{id:'gold',icon:'🪙',name:'战地拾荒',desc:'击杀额外获得金币',max:5},{id:'xpboost',icon:'📘',name:'战斗研修',desc:'获得经验增加 15%',max:5},{id:'sprint',icon:'🏃',name:'冲刺训练',desc:'缩短闪避冷却时间',max:4},{id:'thorns',icon:'🌵',name:'反击装甲',desc:'受伤时反伤附近敌人',max:5},{id:'aura',icon:'🌟',name:'辐射光环',desc:'持续伤害近身敌人',max:5},{id:'bulwark',icon:'🏰',name:'重型壁垒',desc:'护盾恢复速度提高',max:4},{id:'medic',icon:'❤️',name:'医疗专家',desc:'治疗效果提高',max:5},{id:'shock',icon:'⚡',name:'电弧弹头',desc:'子弹概率额外电击',max:5},{id:'giant',icon:'🔴',name:'巨型弹丸',desc:'弹丸体积与伤害提高',max:4},{id:'overdrive',icon:'🚀',name:'战斗超频',desc:'击杀后短暂加速射击',max:5},{id:'fortify',icon:'🧱',name:'坚韧生命',desc:'提高最大生命值',max:5},{id:'collector',icon:'🧲',name:'能量回收',desc:'拾取经验时额外回复生命',max:4},{id:'momentum',icon:'💨',name:'高速战术',desc:'移动时获得额外伤害',max:5}];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const r=heroCv.getBoundingClientRect();heroCv.width=Math.max(1,r.width*dpr);heroCv.height=Math.max(1,r.height*dpr);hc.setTransform(dpr,0,0,dpr,0,0);backgroundStars=Array.from({length:85},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(.5,2)}))}addEventListener('resize',resize);function updateHome(){ $('coins').textContent=save.coins.toLocaleString();$('gems').textContent=save.gems;$('metaLv').textContent=save.level;$('best').textContent=formatTime(save.best);$('totalKills').textContent=save.totalKills;$('runs').textContent=save.runs;$('equipName').textContent=weapons[save.weapon].name;$('dailyProgress').textContent=`${Math.min(save.daily,100)}/100`;$('dailyClaim').disabled=save.daily<100||save.claimed;$('dailyClaim').textContent=save.claimed?'已领取':'领取 +150';persist()}function formatTime(t){let s=Math.floor(t);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function claimDaily(){if(save.daily>=100&&!save.claimed){save.coins+=150;save.claimed=true;updateHome()}}function showHome(){game=null;paused=false;modalOpen=false;$('home').classList.add('active');$('hud').classList.remove('active');$('overlay').classList.remove('show');updateHome()}function showModal(html){modalOpen=true;$('modal').innerHTML=html;$('overlay').classList.add('show')}function closeModal(){modalOpen=false;$('overlay').classList.remove('show')}const achievements=[{id:'first',name:'🌱 初次出征',desc:'完成 1 局',test:()=>save.runs>=1,coins:100},{id:'hunter',name:'⚔️ 病毒猎手',desc:'累计击杀 100 个敌人',test:()=>save.totalKills>=100,coins:180},{id:'veteran',name:'🎖️ 战场老兵',desc:'完成 10 局',test:()=>save.runs>=10,coins:300},{id:'survivor',name:'⏱️ 不屈防线',desc:'单局生存 3 分钟',test:()=>save.best>=180,coins:350},{id:'slayer',name:'👑 母体终结者',desc:'累计击败 3 个 Boss',test:()=>save.totalBosses>=3,coins:400},{id:'champion',name:'🏆 极限征服者',desc:'完成 1 次极限挑战',test:()=>save.challengeWins>=1,coins:600}];function claimAchievement(id){let a=achievements.find(x=>x.id===id);if(!a||save.achievements[id]||!a.test())return;save.achievements[id]=true;save.coins+=a.coins;updateHome();showPanel('achievements');toast('🏅 成就奖励 +'+a.coins+' 金币')}function showPanel(which){let html='';if(which==='achievements'){html='<h2>🏅 荣誉成就</h2><p class="desc">达成目标后手动领取永久金币奖励。</p>'+achievements.map(a=>'<div class="statrow"><span><b>'+a.name+'</b><small style="display:block;opacity:.7">'+a.desc+'</small></span><button class="btn alt" '+(save.achievements[a.id]||!a.test()?'disabled':'')+' onclick="claimAchievement(\''+a.id+'\')">'+(save.achievements[a.id]?'已领取':a.test()?'领取 '+a.coins:'未完成')+'</button></div>').join('')}if(which==='challenges'){html='<h2>🎯 特殊挑战</h2><p class="desc">挑战模式单局存活 120 秒即胜利。胜利可获得额外奖励。</p><div class="shopgrid"><div class="panel shopitem"><div class="big">⚡</div><b>极速围城</b><p class="desc">敌人移动更快，生存 120 秒</p><button class="btn" onclick="startGame(\'rush\')">开始挑战</button></div><div class="panel shopitem"><div class="big">💀</div><b>脆弱防线</b><p class="desc">初始生命减半，生存 120 秒</p><button class="btn" onclick="startGame(\'fragile\')">开始挑战</button></div><div class="panel shopitem"><div class="big">🌊</div><b>无尽感染</b><p class="desc">敌人刷新更密集，生存 120 秒</p><button class="btn" onclick="startGame(\'swarm\')">开始挑战</button></div></div>'}if(which==='armory'){html='<h2>🔫 武器库</h2><div class="shopgrid">'+weapons.map((w,i)=>`<div class="panel shopitem"><div class="big">${w.icon}</div><b>${w.name}</b><p class="desc">伤害 ${w.damage} · 射速 ${(1/w.rate).toFixed(1)}/秒</p><button class="btn ${save.weapon===i?'green':'alt'}" onclick="buyWeapon(${i})">${save.weapon===i?'已装备':save.unlocked.includes(i)?'装备':`🪙 ${w.price}`}</button></div>`).join('')+'</div>'}if(which==='talents'){const names=['❤️ 生命强化','🔫 火力强化','👟 移动训练','🧲 经验增益'];html='<h2>✨ 永久天赋</h2><p class="desc">每次购买都会永久提高角色的基础属性。</p><div class="shopgrid">'+names.map((n,i)=>`<div class="panel shopitem"><div class="big">${['💚','🔥','👟','🌟'][i]}</div><b>${n}</b><p class="desc">等级 ${save.talents[i]}/10</p><button class="btn" ${save.talents[i]>=10?'disabled':''} onclick="buyTalent(${i})">🪙 ${100*(save.talents[i]+1)}</button></div>`).join('')+'</div>'}if(which==='shop'){html='<h2>🛒 补给商店</h2><p class="desc">战局奖励可以兑换补给。所有购买会保存到本机。</p><div class="shopgrid"><div class="panel shopitem"><div class="big">💎</div><b>高级物资箱</b><p class="desc">获得 350 金币</p><button class="btn" onclick="buyCrate()">💎 10</button></div><div class="panel shopitem"><div class="big">🎁</div><b>出勤补给</b><p class="desc">免费获得 50 金币（每次进入可领取一次）</p><button class="btn" onclick="claimSupply()">领取</button></div></div>'}if(which==='records'){html=`<h2>🏆 生存档案</h2><div class="statrow"><span>最长生存</span><b>${formatTime(save.best)}</b></div><div class="statrow"><span>累计击杀</span><b>${save.totalKills}</b></div><div class="statrow"><span>战局次数</span><b>${save.runs}</b></div><div class="statrow"><span>指挥官等级</span><b>${save.level}</b></div>`}if(which==='settings'){html=`<h2>⚙ 游戏设置</h2><div class="statrow"><span>屏幕震动</span><button class="btn alt" onclick="settings.shake=!settings.shake;showPanel('settings')">${settings.shake?'开启':'关闭'}</button></div><div class="statrow"><span>粒子特效</span><button class="btn alt" onclick="settings.fx=!settings.fx;showPanel('settings')">${settings.fx?'开启':'关闭'}</button></div><div class="statrow"><span>音效（合成）</span><button class="btn alt" onclick="settings.sound=!settings.sound;showPanel('settings')">${settings.sound?'开启':'关闭'}</button></div><div class="statrow"><span>存档备份</span><button class="btn alt" onclick="backupSave()">导出 JSON</button></div><div class="statrow"><span>减少动态效果</span><button class="btn alt" onclick="settings.reducedMotion=!settings.reducedMotion;showPanel('settings')">${settings.reducedMotion?'开启':'关闭'}</button></div><p class="desc">游戏存档保存在当前浏览器中，清理浏览器数据可能导致存档丢失。</p>`}showModal(html+'<div style="text-align:center;margin-top:16px"><button class="btn alt" onclick="closeModal()">返回主界面</button></div>')}let settings={shake:true,fx:true,sound:true,reducedMotion:false};function buyWeapon(i){let w=weapons[i];if(!w)return;if(!save.unlocked.includes(i)){if(save.coins<w.price){toast('金币不足');return}save.coins-=w.price;save.unlocked.push(i)}save.weapon=i;updateHome();showPanel('armory')}function buyTalent(i){let cost=100*(save.talents[i]+1);if(i<0||i>=4||save.talents[i]>=10)return;if(save.coins<cost){toast('金币不足');return}save.coins-=cost;save.talents[i]++;updateHome();showPanel('talents')}function buyCrate(){if(save.gems<10){toast('宝石不足');return}save.gems-=10;save.coins+=350;updateHome();showPanel('shop')}function claimSupply(){if(sessionStorage.getItem('claimedSupply')){toast('本次补给已领取');return}sessionStorage.setItem('claimedSupply','1');save.coins+=50;updateHome();showPanel('shop')}
