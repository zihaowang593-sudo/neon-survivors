name: Browser regression tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --check tests/ci-smoke.cjs
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>\s*'use strict';([\s\S]*?)<\/script>/);if(!m)throw Error('Main game script missing');new Function(m[1]);console.log('Game JS syntax OK')"
      - name: Install browser testing dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start local server and run browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/neon-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ -o /dev/null || { cat /tmp/neon-server.log; exit 1; }
          node tests/ci-smoke.cjs
      - name: Print local server log on failure
        if: failure()
        run: cat /tmp/neon-server.log || true
      - name: Upload actual mobile and desktop visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-screenshots
          path: tests/screenshots/
          retention-days: 5
          if-no-files-found: ignore
