name: Import supplied chapter lobby artwork
on:
  push:
    paths:
      - .github/workflows/import-chapter-lobby.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch confirmed game lobby art and commit optimized image
        env:
          CANVA_HIGH: 'https://media.canva.com/v2/image-resize/format:JPG/height:1536/quality:88/uri:ifs%3A%2F%2FM%2Fce369881-68a2-44f8-ab9d-0e6516a0fa3e/watermark:F/width:864?csig=AAAAAAAAAAAAAAAAAAAAAN-aUCCLzcPnGv6W4v2QUhs0JqW2SFreRVK6QyyMIPpW&exp=1795232933&osig=AAAAAAAAAAAAAAAAAAAAADV4AFNR5ONQxwYrsNVTz379x88I7fpMrbs9solJrijD&signer=media-rpc&token=AAIAAU0AJGNlMzY5ODgxLTY4YTItNDRmOC1hYjlkLTBlNjUxNmEwZmEzZQAAAAABofw4pIgI-UaXMtyVlQaCi8knxn3_pbusiIMzIs__yirztz0ndA&x-canva-quality=high'
          CANVA_HIGH_BACKUP: 'https://media.canva.com/v2/image-resize/format:JPG/height:1536/quality:88/uri:ifs%3A%2F%2FM%2Fce369881-68a2-44f8-ab9d-0e6516a0fa3e/watermark:F/width:864?csig=AAAAAAAAAAAAAAAAAAAAAN-aUCCLzcPnGv6W4v2QUhs0JqW2SFreRVK6QyyMIPpW&exp=1795232933&osig=AAAAAAAAAAAAAAAAAAAAADV4AFNR5ONQxwYrsNVTz379x88I7fpMrbs9solJrijD&signer=media-rpc&token=AAIAAU0AJGNlMzY5ODgxLTY4YTItNDRmOC1hYjlkLTBlNjUxNmEwZmEzZQAAAAABofw4pIgI-UaXMtyVlQaCi8knxn3_pbusiIMzIs__yirztz0ndA&x-canva-quality=thumbnail'
          CANVA_THUMB: 'https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Fce369881-68a2-44f8-ab9d-0e6516a0fa3e/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAN-aUCCLzcPnGv6W4v2QUhs0JqW2SFreRVK6QyyMIPpW&exp=1795232933&osig=AAAAAAAAAAAAAAAAAAAAADV4AFNR5ONQxwYrsNVTz379x88I7fpMrbs9solJrijD&signer=media-rpc&token=AAIAAU0AJGNlMzY5ODgxLTY4YTItNDRmOC1hYjlkLTBlNjUxNmEwZmEzZQAAAAABofw4pIgI-UaXMtyVlQaCi8knxn3_pbusiIMzIs__yirztz0ndA&x-canva-quality=thumbnail'
        run: |
          set -eu
          mkdir -p assets
          python -m pip install --quiet Pillow
          python - <<'PY'
          import os,urllib.request,io
          from PIL import Image
          attempts=[os.getenv('CANVA_HIGH'),os.getenv('CANVA_HIGH_BACKUP'),os.getenv('CANVA_THUMB')]
          for i,url in enumerate(attempts):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as conn: content=conn.read()
              picture=Image.open(io.BytesIO(content)).convert('RGB')
              print('FETCH',i,picture.size,flush=True)
              if picture.width<500 and i<2:continue
              picture.save('assets/reference-lobby.webp','WEBP',quality=81,method=6)
              print('SUCCESS',os.stat('assets/reference-lobby.webp').st_size,flush=True)
              break
            except Exception as e:
              print('FAILED',i,str(e)[:200],flush=True)
          else: raise SystemExit('Cannot retrieve reference photo')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reference-lobby.webp
          git diff --cached --quiet || (git commit -m "asset: import confirmed illustrated chapter lobby reference" && git push)
