(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,DPR,mode='menu',last=0,time=0,spawn=0,bossTime=0,shake=0,flash=0,kills=0,level=1,xp=0,xpNeed=12,score=0,player,enemies=[],bullets=[],particles=[],gems=[],texts=[],effects=[],obstacles=[],stars=[],keys={},pointer=null,joy={x:0,y:0},touchDevice=('ontouchstart'in window),upgrades={},weaponTimer=0,orbitTimer=0,lightningTimer=0,regenTimer=0,chosen=[];const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:110},()=>({x:rand(0,W),y:rand(0,H),r:rand(.5,2),a:rand(.1,.5)}))}addEventListener('resize',resize);resize();function panel(html){$('panel').innerHTML=html;$('screen').classList.remove('hidden')}function hidePanel(){$('screen').classList.add('hidden')}function showMenu(){mode='menu';$('hud').style.display='none';$('xp').style.display='none';$('pause').style.display='none';panel('<div style="font-size:46px">🚀 ✨ 👾</div><h1>星核幸存者</h1><div style="letter-spacing:4px;color:#7ce6ff;font-weight:800">NEON SURVIVORS</div><p>外星虫潮席卷地球。驾驶星核战士，在无尽怪潮中进化武器，击败巨型首领！</p><button id="start">⚡ 开始生存</button><p class="small">电脑：WASD / 方向键移动 · 空格暂停<br>手机：按住屏幕任意位置拖动移动 · 自动瞄准射击</p><div class="small">单文件 HTML · 无需联网 · 支持手机与电脑</div>');$('start').onclick=startGame}function startGame(){mode='playing';time=0;spawn=0;bossTime=0;shake=0;flash=0;kills=0;level=1;xp=0;xpNeed=12;score=0;upgrades={damage:0,rate:0,multi:0,speed:0,magnet:0,shield:0,orbit:0,lightning:0,regen:0,pierce:0,crit:0,blast:0};weaponTimer=0;orbitTimer=0;lightningTimer=0;regenTimer=0;player={x:0,y:0,r:17,hp:100,maxHp:100,speed:225,inv:0,angle:0};enemies=[];bullets=[];particles=[];gems=[];texts=[];effects=[];obstacles=[];chosen=[];for(let i=0;i<45;i++){let x=rand(-1500,1500) .x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;if(d<player.r+e.r-3&&player.inv<=0){player.hp-=e.damage;player.inv=.65;shake=12;flash=.17;particle(player.x,player.y,'#ff527c',15,190);if(player.hp<=0){player.hp=0;gameOver();break}}}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies){if(e.hp<=0||b.hit.has(e))continue;if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){b.hit.add(e);let crit=Math.random()<upgrades.crit*.09;damageEnemy(e,b.damage*(crit?2.2:1),crit);if(upgrades.blast)boom(b.x,b.y,34+upgrades.blast*13,7*upgrades.blast);if(b.pierce--<=0){b.life=0;break}}}}bullets=bullets.filter(b=>b.life>0);enemies=enemies.filter(e=>e.hp>0);for(let g of gems){let dx=player.x-g.x,dy=player.y-g.y,d=Math.hypot(dx,dy)||1,range=90*Math.pow(1.45,upgrades.magnet);if(d<range){g.x+=dx/d*Math.max(220,range*2)*dt;g.y+=dy/d*Math.max(220,range*2)*dt}if(d<player.r+12){g.dead=true;xp+=g.value;particle(g.x,g.y,'#63f4ff',3,60)}}gems=gems.filter(g=>!g.dead);if(xp>=xpNeed){xp-=xpNeed;xpNeed=Math.floor(xpNeed*1.27+5);level++;levelUp()}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(0,1-3*dt);p.vy*=Math.max(0,1-3*dt);p.life-=dt}particles=particles.filter(p=>p.life>0);for(let t of texts){t.y-=45*dt;t.life-=dt}texts=texts.filter(t=>t.life>0);for(let e of effects)e.life-=dt;effects=effects.filter(e=>e.life>0);shake=Math.max(0,shake-35*dt);flash=Math.max(0,flash-dt);updateHud()}function gameOver(){mode='over';$('pause').style.display='none';$('joystick').style.display='none';panel(`<div style="font-size:55px">💀</div><h1>战斗结束</h1><p>你在虫潮中坚持了 <b>${Math.floor(time/60)}分${Math.floor(time%60)}秒</b></p><div style="display:flex;justify-content:center;gap:28px;margin:20px"><div>🏆<h2>${kills}</h2><span class="small">击败敌人</span></div><div>⭐<h2>${level}</h2><span class="small">最终等级</span></div><div>💎<h2>${score}</h2><span class="small">得分</span></div></div><button id="retry">🔄 再战一次</button><button id="home">主菜单</button>`);$('retry').onclick=startGame;$('home').onclick=showMenu}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b132a';ctx.fillRect(0,0,W,H);if(!player){for(let s of stars){ctx.fillStyle=`rgba(130,190,255,${s.a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()}requestAnimationFrame(loop);return}ctx.save();ctx.translate(W/2-player.x+(shake?rand(-shake,shake):0),H/2-player.y+(shake?rand(-shake,shake):0));let left=player.x-W/2-80,top=player.y-H/2-80;ctx.strokeStyle='#24375b';ctx.lineWidth=1;ctx.beginPath();for(let x=Math.floor(left/64)*64;x<left+W+160;x+=64){ctx.moveTo(x,top);ctx.lineTo(x,top+H+160)}for(let y=Math.floor(top/64)*64;y<top+H+160;y+=64){ctx.moveTo(left,y);ctx.lineTo(left+W+160,y)}ctx.stroke();for(let o of obstacles){if(Math.abs(o.x-player.x)>W||Math.abs(o.y-player.y)>H)continue;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.x);ctx.fillStyle=o.type?'#294a66':'#304165';ctx.strokeStyle=o.type?'#4c9bba':'#617ba8';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<6;i++){let a=i*TAU/6,r=o.r*(i%2?.82:1);i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}for(let g of gems){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(time*2);ctx.shadowColor='#52f5ff';ctx.shadowBlur=14;ctx.fillStyle='#5cf4f9';ctx.beginPath();ctx.moveTo(0,-g.r*1.6);ctx.lineTo(g.r,0);ctx.lineTo(0,g.r*1.6);ctx.lineTo(-g.r,0);ctx.closePath();ctx.fill();ctx.restore()}for(let e of enemies){ctx.save();ctx.translate(e.x,e.y+Math.sin(e.phase)*2);ctx.shadowColor=e.color;ctx.shadowBlur=e.type==='boss'?25:9;ctx.fillStyle=e.hit?'#fff':e.color;ctx.strokeStyle='#1c2445';ctx.lineWidth=4;ctx.beginPath();if(e.type==='fast'){ctx.moveTo(e.r,0);ctx.lineTo(-e.r,-e.r*.8);ctx.lineTo(-e.r,e.r*.8)}else{ctx.ellipse(0,0,e.r,e.r*.9,0,0,TAU)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff';let eye=e.r*.32;ctx.beginPath();ctx.arc(-eye,-3,e.r*.16,0,TAU);ctx.arc(eye,-3,e.r*.16,0,TAU);ctx.fill();ctx.fillStyle='#152344';ctx.beginPath();ctx.arc(-eye+2,-3,e.r*.08,0,TAU);ctx.arc(eye+2,-3,e.r*.08,0,TAU);ctx.fill();if(e.hp<e.maxHp||e.type==='boss'){ctx.fillStyle='#16243a';ctx.fillRect(-e.r,-e.r-13,e.r*2,5);ctx.fillStyle='#ff6484';ctx.fillRect(-e.r,-e.r-13,e.r*2*Math.max(0,e.hp/e.maxHp),5)}ctx.restore()}for(let b of bullets){ctx.save();ctx.shadowColor='#6cf2ff';ctx.shadowBlur=22;ctx.fillStyle='#c4ffff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.restore()}for(let e of effects){if(e.lightning){ctx.strokeStyle='#b3faff';ctx.shadowColor='#66dfff';ctx.shadowBlur=22;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x,e.y);let mx=(e.x+e.x2)/2+rand(-18,18),my=(e.y+e.y2)/2+rand(-18,18);ctx.lineTo(mx,my);ctx.lineTo(e.x2,e.y2);ctx.stroke();ctx.shadowBlur=0}else{ctx.strokeStyle=`rgba(255,188,99,${e.life*4})`;ctx.lineWidth=6;ctx.beginPath();ctx.arc(e.x,e.y,e.max*(1-e.life/.25),0,TAU);ctx.stroke()}}if(upgrades.orbit)for(let i=0;i<upgrades.orbit;i++){let a=time*3+i*TAU/upgrades.orbit,r=65+upgrades.orbit*5;ctx.save();ctx.translate(player.x+Math.cos(a)*r,player.y+Math.sin(a)*r);ctx.rotate(a+time*4);ctx.shadowColor='#79baff';ctx.shadowBlur=20;ctx.fillStyle='#9beeff';ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(13,0);ctx.lineTo(0,17);ctx.lineTo(-13,0);ctx.closePath();ctx.fill();ctx.restore()}ctx.save();ctx.translate(player.x,player.y);if(player.inv>0&&Math.floor(time*20)%2===0)ctx.globalAlpha=.45;ctx.shadowColor='#61caff';ctx.shadowBlur=24;ctx.fillStyle='#4ddaff';ctx.strokeStyle='#17315e';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,player.r,0,TAU);ctx.fill();ctx.stroke();ctx.rotate(player.angle);ctx.fillStyle='#f2f9ff';ctx.fillRect(9,-6,23,12);ctx.fillStyle='#203b76';ctx.fillRect(17,-4,11,8);ctx.rotate(-player.angle);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-4,3,0,TAU);ctx.arc(5,-4,3,0,TAU);ctx.fill();ctx.restore();for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;for(let t of texts){ctx.globalAlpha=t.life/.7;ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillStyle=t.color;ctx.fillText(t.s,t.x,t.y)}ctx.globalAlpha=1;ctx.restore();if(flash){ctx.fillStyle=`rgba(255,45,85,${flash*.6})`;ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}function loop(now){let dt=Math.min((now-last)/1000||0,.033);last=now;if(mode==='playing')update(dt);draw()}addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='Escape')togglePause()});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});function togglePause(){if(mode==='playing'){mode='paused';panel('<div style="font-size:45px">⏸️</div><h1>游戏暂停</h1><p>准备好继续抵抗虫潮了吗？</p><button id="resume">继续战斗</button><button id="quit">返回主菜单</button>');$('resume').onclick=()=>{mode='playing';hidePanel()};$('quit').onclick=showMenu}else if(mode==='paused'){mode='playing';hidePanel()}}$('pause').onclick=togglePause;function touchMove(e){if(!pointer)return;let t=[...e.touches].find(t=>t.identifier===pointer.id);if(!t)return;let dx=t.clientX-pointer.x,dy=t.clientY-pointer.y,d=Math.hypot(dx,dy),m=Math.min(d,43);joy.x=d?dx/d*Math.min(1,d/30):0;joy.y=d?dy/d*Math.min(1,d/30):0;$('joystick').style.left=(pointer.x-60)+'px';$('joystick').style.top=(pointer.y-60)+'px';$('joystick').style.bottom='auto';$('nub').style.transform=`translate(${d?dx/d*m:0}px,${d?dy/d*m:0}px)`}c.addEventListener('touchstart',e=>{if(mode!=='playing'||pointer)return;let t=e.changedTouches[0];pointer={id:t.identifier,x:t.clientX,y:t.clientY};touchMove(e)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();touchMove(e)},{passive:false});function endTouch(e){if(!pointer)return;if([...e.changedTouches].some(t=>t.identifier===pointer.id)){pointer=null;joy.x=joy.y=0;$('nub').style.transform='translate(0,0)'}}c.addEventListener('touchend',endTouch);c.addEventListener('touchcancel',endTouch);showMenu();requestAnimationFrame(loop)})();
