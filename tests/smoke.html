<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地球防线 · 自动冒烟测试</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1230;color:#eaf3ff;font:15px/1.6 system-ui,-apple-system,sans-serif;padding:24px;max-width:820px;margin:auto}h1{color:#ffe39b}button{padding:12px 20px;background:#4a69e8;border:1px solid #a3dfff;border-radius:10px;color:white;font-weight:800;font-size:16px}button:disabled{opacity:.5}#status{margin:16px 0;font-weight:800}.item{padding:9px 12px;border-radius:9px;margin:6px 0;background:#222c52;border-left:4px solid #f66}.item.ok{border-color:#6ef0ab}small{opacity:.75}iframe{position:absolute;left:-10000px;top:0;width:390px;height:844px;border:0;pointer-events:none}</style></head><body><h1>地球防线 · V4.9 自动冒烟测试</h1><p>测试游戏启动、基础数值、Boss 轮换、战场事件、互动装置、升级选项和 Canvas 绘制。测试在隔离的同源 iframe 中运行，不会执行正常战斗结算。</p><button id="run" disabled>正在加载游戏…</button><div id="status" role="status">等待游戏初始化</div><div id="results"></div><p><small>此页面仅为浏览器冒烟测试，不能替代 iPhone 实机帧率、触控或完整战斗流程测试。首次加载需要数秒。</small></p><iframe id="game" src="../?smoke=1" title="测试游戏实例"></iframe><script>const iframe=document.getElementById('game'),btn=document.getElementById('run'),status=document.getElementById('status'),list=document.getElementById('results');let tries=0;const ready=setInterval(()=>{tries++;try{if(iframe.contentWindow.__gameQA){clearInterval(ready);btn.disabled=false;btn.textContent='运行全部测试';status.textContent='游戏加载成功，可以运行测试';return}}catch(e){}if(tries>80){clearInterval(ready);status.textContent='加载超时：请检查游戏页面或浏览器控制台';btn.textContent='重新加载';btn.disabled=false;btn.onclick=()=>location.reload()}},250);btn.addEventListener('click',()=>{btn.disabled=true;list.replaceChildren();try{const report=iframe.contentWindow.__gameQA.run();status.textContent='通过 '+report.passed+' / '+report.total+' 项 · V'+report.version;for(const r of report.results){let el=document.createElement('div');el.className='item'+(r.ok?' ok':'');el.textContent=(r.ok?'✓ ':'✗ ')+r.name+(r.error?' — '+r.error:'');list.appendChild(el)}}catch(e){status.textContent='测试执行异常：'+String(e.message||e)}finally{btn.disabled=false}});</script></body></html>
