<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>商店 · 参考视频精细复刻</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#262b3e;font-family:system-ui,sans-serif}
#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:#731485;overflow:hidden}
.slice{position:relative;line-height:0;width:100%;flex:none}.slice img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
#scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none}
#header,#footer{display:none!important}#scroller{flex:1!important}
.tap{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;touch-action:manipulation}
.tap:active{background:#fff4}
.details{display:none;background:#343a52;color:white;text-align:center;border:4px solid #21152d;padding:14px;font-weight:900;line-height:1.5}
.details.open{display:block}.actions{display:flex;gap:12px;margin-top:12px}
.actions button,.confirm{flex:1;background:linear-gradient(#fff16b,#ffb100);border:3px solid #25142c;border-radius:4px;padding:12px 5px;font-weight:900;color:#fff;text-shadow:1px 2px #583d22;font-size:16px}
.actions button:last-child{background:linear-gradient(#adff51,#55c600)}
#modal{display:none;position:fixed;inset:0;background:#0d0925bc;z-index:8;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}#panel{max-width:380px;width:100%;background:#394159;border:4px solid #21172c;color:#fff;text-align:center;padding:16px;font-weight:800;border-radius:7px}
#panel h2{margin:0 0 12px;color:#ffda37}#panel p{line-height:1.6}
#close{background:#ffcc32;border:2px solid #29152d;border-radius:5px;padding:10px 30px;font-weight:900}

/* V18.17 clean image boundaries: one source strip per section, no CSS overlay bars. */
.slice.tech,.slice.collection,.slice.sgear,.slice.supply,.slice.gems{overflow:hidden}
.slice.tech{aspect-ratio:707 / 201}
.slice.collection{aspect-ratio:707 / 185}
.slice.sgear{aspect-ratio:707 / 189}
.slice.supply{aspect-ratio:707 / 513}
.slice.gems{aspect-ratio:707 / 292}
.slice.gems img{position:absolute;left:0;top:0;transform:translateY(-69.6%);height:auto!important}
.slice.collection::before,.slice.sgear::before{content:attr(data-title);display:flex;align-items:center;justify-content:center;position:absolute;z-index:2;left:2%;right:2%;top:0;height:21%;color:white;font-weight:900;font-size:clamp(15px,3.9vw,25px);line-height:1.1;text-shadow:-1px -1px #302032,1px -1px #302032,-1px 1px #302032,1px 1px #302032,0 2px #302032;pointer-events:none}
.slice.collection::before{background:linear-gradient(#ff4380,#e51b62)}
.slice.sgear::before{background:linear-gradient(#ffc15d,#e58c2c)}
.slice.tech .tap,.slice.collection .tap,.slice.sgear .tap{display:block!important}
.slice.tech::after,.slice.collection::after,.slice.sgear::after{display:none!important}
.slice.collection::before,.slice.sgear::before{display:none!important}
.details{margin:0 2%;border:3px solid #1d1930;background:linear-gradient(180deg,#474a65,#292d44);padding:12px 10px;box-shadow:inset 0 2px #8b8fa4;font-size:clamp(12px,3vw,16px)}
.details.open{display:block}
.details .actions{margin-top:9px}
.details .actions button{font-size:clamp(12px,3.4vw,16px);padding:10px 3px}
.slice.tech img,.slice.collection img,.slice.sgear img{height:auto}

function tap(part,x,y,w,h,label,fn){

 tap(k,190,y[k],505,55,'展开'+k+'宝箱详情',()=>{
